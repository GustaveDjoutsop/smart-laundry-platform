spring:
  datasource:
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    schemas: payment
    default-schema: payment
    validate-on-migrate: true
  jpa:
    # Flyway is the schema source of truth here (validated separately below);
    # ddl-auto=validate would also check every unrelated entity/table against
    # the schema (there's a pre-existing drift on pricing.updated_at,
    # TIMESTAMPTZ vs the entity's TIMESTAMP, unrelated to this test) — skip it.
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        default_schema: payment
        # The base test/resources/application.yml sets H2Dialect for the H2-backed
        # default profile; this profile runs against real Testcontainers Postgres.
        dialect: org.hibernate.dialect.PostgreSQLDialect
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://example.auth0.com/
      client:
        provider:
          auth0:
            token-uri: https://example.auth0.com/oauth/token
        registration:
          smartlaundry-m2m:
            provider: auth0
            client-id: test-client-id
            client-secret: test-client-secret
            authorization-grant-type: client_credentials
            scope: sls-machine-start, sls-machine-read, sls-bot-admin

auth0:
  audience: https://smartlaundry.api

machine-state-service:
  base-url: http://localhost:8082

bot-manager-service:
  base-url: http://localhost:8090
  bot-id: laundry
