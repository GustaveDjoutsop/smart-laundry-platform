name: PaymentManagementService — CI/CD

on:
  push:
    branches: [master, develop]
    paths:
      - 'PaymentManagementService/**'
      - '.github/workflows/payment-management-service.yml'
  pull_request:
    branches: [master, develop]
    paths:
      - 'PaymentManagementService/**'
      - '.github/workflows/payment-management-service.yml'
  workflow_dispatch:

defaults:
  run:
    working-directory: PaymentManagementService

jobs:
  # ── 1. Build & test ──────────────────────────────────────────────────────────
  test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin
          cache: maven

      - name: Build and run unit tests
        run: mvn -B verify -DskipITs=true

  # ── 2. Deploy to Railway (dev) — only on push to master/develop, after CI green ──
  deploy-dev:
    name: Deploy → Railway (dev)
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/develop')

    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway
        working-directory: PaymentManagementService
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        # Secrets (AUTH0_*, CAMPAY_*, SPRING_DATASOURCE_*) are synced into Railway
        # by the Doppler→Railway integration — no secret injection needed here.
        # MACHINE_STATE_SERVICE_URL is a Railway service reference set in Railway UI.
        run: railway up --service ${{ secrets.RAILWAY_SERVICE_ID_PAYMENT }} --detach
