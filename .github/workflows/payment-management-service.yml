name: PaymentManagementService — CI/CD

on:
  push:
    branches: [master, develop]
    paths:
      - 'PaymentManagementService/**'
      - '.github/workflows/payment-management-service.yml'
  pull_request:
    branches: [master, develop]
    paths:
      - 'PaymentManagementService/**'
      - '.github/workflows/payment-management-service.yml'
  workflow_dispatch:

defaults:
  run:
    working-directory: PaymentManagementService

jobs:
  # ── 1. Build & test ──────────────────────────────────────────────────────────
  test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: temurin
          cache: maven

      - name: Build and run unit tests
        run: mvn -B verify -DskipITs=true

  # ── 2. Code style (Checkstyle) ────────────────────────────────────────────────
  code-style:
    name: Code Style (Checkstyle)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: temurin
          cache: maven

      - name: Run Checkstyle
        run: mvn checkstyle:check -B

  # ── 3. OWASP Dependency Check ─────────────────────────────────────────────────
  dependency-security:
    name: OWASP Dependency Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: temurin
          cache: maven

      - name: Cache OWASP NVD database
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: ${{ runner.os }}-owasp-${{ hashFiles('PaymentManagementService/pom.xml') }}
          restore-keys: ${{ runner.os }}-owasp-

      - name: Run OWASP Dependency Check
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          mvn org.owasp:dependency-check-maven:check -B \
            -DfailBuildOnCVSS=7 \
            -DnvdApiKey="${NVD_API_KEY}" \
            -DsuppressionFile='${maven.multiModuleProjectDirectory}/../owasp-suppressions.xml'

      - name: Upload OWASP report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owasp-report-payment
          path: PaymentManagementService/target/dependency-check-report.html
          retention-days: 14

  # Deployment to Railway (dev) is handled by Railway's native GitHub integration
  # (auto-deploys on push to master/develop). A previous custom "railway up" CLI
  # deploy step here was redundant with that integration and consistently failed
  # its build (working-directory mismatch: it uploaded PaymentManagementService/
  # itself as the archive root, while Railway's service is configured expecting
  # PaymentManagementService/Dockerfile inside a repo-root-rooted archive) —
  # removed rather than fixed, since the native integration already deploys
  # reliably.
