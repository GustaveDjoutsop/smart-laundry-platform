name: PaymentManagementService — CI/CD

on:
  push:
    branches: [master, develop]
    paths:
      - 'PaymentManagementService/**'
      - '.github/workflows/payment-management-service.yml'
  pull_request:
    branches: [master, develop]
    paths:
      - 'PaymentManagementService/**'
      - '.github/workflows/payment-management-service.yml'
  workflow_dispatch:

defaults:
  run:
    working-directory: PaymentManagementService

jobs:
  # ── 1. Build & test ──────────────────────────────────────────────────────────
  test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: temurin
          cache: maven

      - name: Build and run unit tests
        run: mvn -B verify -DskipITs=true

  # ── 2. Code style (Checkstyle) ────────────────────────────────────────────────
  code-style:
    name: Code Style (Checkstyle)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: temurin
          cache: maven

      - name: Run Checkstyle
        run: mvn checkstyle:check -B

  # OWASP Dependency Check moved to .github/workflows/owasp-weekly-scan.yml (R5
  # follow-up): a cold NVD data pull routinely took 20-30+ minutes even with a
  # valid API key, which made it a bad fit for per-PR blocking. It still fails
  # the same CVSS>=7 gate, just on a weekly schedule against master instead of
  # on every push.

  # Deployment to Railway (dev) is handled by Railway's native GitHub integration
  # (auto-deploys on push to master/develop). A previous custom "railway up" CLI
  # deploy step here was redundant with that integration and consistently failed
  # its build (working-directory mismatch: it uploaded PaymentManagementService/
  # itself as the archive root, while Railway's service is configured expecting
  # PaymentManagementService/Dockerfile inside a repo-root-rooted archive) —
  # removed rather than fixed, since the native integration already deploys
  # reliably.
