name: MachineStateService — CI/CD

on:
  push:
    branches: [master, develop]
    paths:
      - 'MachineStateService/**'
      - '.github/workflows/machine-state-service.yml'
  pull_request:
    branches: [master, develop]
    paths:
      - 'MachineStateService/**'
      - '.github/workflows/machine-state-service.yml'
  workflow_dispatch:

defaults:
  run:
    working-directory: MachineStateService

jobs:
  # ── 1. Build & test ──────────────────────────────────────────────────────────
  test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: temurin
          cache: maven

      - name: Build and run unit tests
        run: mvn -B verify -DskipITs=true

  # ── 2. Deploy to Railway (dev) — only on push/dispatch to master/develop ─────
  deploy-dev:
    name: Deploy → Railway (dev)
    needs: test
    runs-on: ubuntu-latest
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/develop')

    steps:
      - uses: actions/checkout@v5

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway
        working-directory: MachineStateService
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        # Secrets (AUTH0_*, SPRING_DATASOURCE_*, MQTT_*, EQLINK_*) synced via
        # Doppler→Railway integration. PAYMENT_SERVICE_URL is a Railway service
        # reference set in Railway UI once PaymentManagementService is deployed.
        run: railway up --service ${{ secrets.RAILWAY_SERVICE_ID_MACHINE }}
