name: Secret Scan

# BLOCKING gate. Unlike the OWASP and Checkstyle jobs (which are advisory and
# end in `|| true`), this workflow is meant to fail the build on any finding.
# A leaked credential is not a style opinion.
#
# Motivated by the R1 incident: a live Twilio account SID + auth token were
# committed in the root docker-compose.yml and survived the earlier Phase 0
# secret stripping, which only ever covered application.yml/application.yaml.
# See docs/SECRET-ROTATION.md.
#
# ── WHY THERE IS NO FULL-HISTORY JOB ────────────────────────────────────────
# Scanning all history reports 47 findings and always will: the historical
# leaks are remediated by ROTATION at the provider, not by rewriting git
# history (docs/SECRET-ROTATION.md §5 explains that choice). A job that is red
# forever teaches everyone to ignore it, so we deliberately scan two things
# that CAN be green and stay green:
#
#   1. working-tree — is the current checkout clean? Catches a secret that
#      lands via any path, including a direct push to master.
#   2. new-commits  — do the commits this PR adds introduce a secret? This is
#      the gate that actually stops a leak before it merges.
#
# To review historical exposure, run scripts/audit-git-history-secrets.sh
# locally. It is an investigative tool, intentionally not a gate.

on:
  pull_request:
    branches: [master, develop]
  push:
    branches: [master, develop]
  schedule:
    # Weekly working-tree sweep, so a secret pushed during an outage or merged
    # by an admin override is caught within seven days.
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

env:
  GITLEAKS_VERSION: '8.21.2'

jobs:
  working-tree:
    name: Working tree is clean
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install gitleaks
        run: |
          curl -sSL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan checkout
        run: |
          gitleaks detect \
            --no-git \
            --config .gitleaks.toml \
            --redact \
            --report-format sarif \
            --report-path gitleaks-tree.sarif \
            --exit-code 1 \
            --verbose

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gitleaks-working-tree-report
          path: gitleaks-tree.sarif
          if-no-files-found: ignore

  new-commits:
    name: PR introduces no secrets
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Need both sides of the diff to scope the scan to this PR's commits.
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          curl -sSL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan commits added by this PR
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          echo "Scanning ${BASE_SHA}..${HEAD_SHA}"
          gitleaks detect \
            --config .gitleaks.toml \
            --log-opts "${BASE_SHA}..${HEAD_SHA}" \
            --redact \
            --report-format sarif \
            --report-path gitleaks-pr.sarif \
            --exit-code 1 \
            --verbose

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gitleaks-pr-report
          path: gitleaks-pr.sarif
          if-no-files-found: ignore
