name: spring-bot-manager-only — CI/CD

on:
  push:
    branches: [master, develop]
    paths:
      - 'spring-bot-manager-only/**'
      - '.github/workflows/spring-bot-manager.yml'
  pull_request:
    branches: [master, develop]
    paths:
      - 'spring-bot-manager-only/**'
      - '.github/workflows/spring-bot-manager.yml'
  workflow_dispatch:

defaults:
  run:
    working-directory: spring-bot-manager-only

jobs:
  # ── 1. Build & test (multi-module) ───────────────────────────────────────────
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: temurin
          cache: maven
          # R8: laundry-contracts is resolved from GitHub Packages, which requires
          # auth even for read-only downloads of a public-repo package. Wires
          # ~/.m2/settings.xml to match the root pom.xml's <repository id="github">.
          server-id: github

      - name: Build and run unit tests
        run: mvn -B verify -DskipITs=true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── 2. Code style (Checkstyle) ────────────────────────────────────────────────
  code-style:
    name: Code Style (Checkstyle)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: temurin
          cache: maven
          server-id: github

      - name: Run Checkstyle
        run: mvn checkstyle:check -B
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # OWASP Dependency Check moved to .github/workflows/owasp-weekly-scan.yml (R5
  # follow-up): a cold NVD data pull routinely took 20-30+ minutes even with a
  # valid API key, which made it a bad fit for per-PR blocking. It still fails
  # the same CVSS>=7 gate, just on a weekly schedule against master instead of
  # on every push.

  # Deployment to Railway (dev) is handled by Railway's native GitHub integration
  # (auto-deploys on push to master/develop). A previous custom "railway up" CLI
  # deploy step here was redundant with that integration — removed rather than
  # fixed, since the native integration already deploys reliably.
