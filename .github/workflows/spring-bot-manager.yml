name: spring-bot-manager-only — CI/CD

on:
  push:
    branches: [master, develop]
    paths:
      - 'spring-bot-manager-only/**'
      - '.github/workflows/spring-bot-manager.yml'
  pull_request:
    branches: [master, develop]
    paths:
      - 'spring-bot-manager-only/**'
      - '.github/workflows/spring-bot-manager.yml'
  workflow_dispatch:

defaults:
  run:
    working-directory: spring-bot-manager-only

jobs:
  # ── 1. Build & test (multi-module) ───────────────────────────────────────────
  test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: temurin
          cache: maven

      - name: Build and run unit tests
        run: mvn -B verify -DskipITs=true

  # Deployment to Railway (dev) is handled by Railway's native GitHub integration
  # (auto-deploys on push to master/develop). A previous custom "railway up" CLI
  # deploy step here was redundant with that integration — removed rather than
  # fixed, since the native integration already deploys reliably.
