name: Quarterly Restore Drill

# Proves the backups produced by .github/workflows/backup-databases.yml can
# actually be restored. Those are two different claims, and only this one
# matters during an incident:
#
#   backup-databases.yml  →  "a readable dump was written to R2"
#   restore-drill.yml     →  "that dump becomes a working database"
#
# A backup that has never been restored is a hypothesis. This workflow turns it
# into a measurement, and writes that measurement into a dated record so
# docs/DISASTER-RECOVERY.md can state a real RTO instead of a guess.
#
# ── WHY QUARTERLY ───────────────────────────────────────────────────────────
# Nightly would be nice but pointless: nothing about the restore path changes
# day to day, and each run costs Actions minutes plus R2 Class B (read)
# operations. Quarterly matches the review cadence in the roadmap and still
# catches the realistic failure modes — a Postgres major-version bump making old
# archives unreadable, a schema change breaking a restore, or an expired R2
# token. Run it manually after any database or Postgres version change.
#
# ── SAFETY ──────────────────────────────────────────────────────────────────
# The restore target is a throwaway Postgres service container that exists only
# for the life of the job. It is never a managed database. scripts/restore-drill.sh
# additionally refuses any target that is not named drill_*, that matches a
# DATABASE_URL_* secret, or that lives on a production host. Read-only R2
# credentials are sufficient here.

on:
  schedule:
    # 03:30 UTC on the 1st of January, April, July and October.
    # Deliberately not the same time as the nightly backup: if both the backup
    # and the drill were to fail on the same morning, two separate failures are
    # easier to tell apart than one combined one.
    - cron: '30 3 1 1,4,7,10 *'
  workflow_dispatch:
    inputs:
      database:
        description: 'Which database to drill'
        type: choice
        default: all
        options: [all, smartbot, machinedb, paymentdb]
      tier:
        description: 'Which backup tier to restore from'
        type: choice
        default: daily
        options: [daily, weekly, monthly]

permissions:
  contents: read
  issues: write   # required to raise the failure issue below

concurrency:
  group: restore-drill
  cancel-in-progress: false

jobs:
  drill:
    name: Restore, time and verify
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      # Postgres 17 to match the pg_dump 17 used to write the archives. A
      # restore into an OLDER server can fail on syntax the older server does
      # not understand, which would look like a backup problem but is not.
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: drill
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install PostgreSQL 17 client
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            --fail https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] \
            https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17
          pg_restore --version

      - name: Create the scratch database
        env:
          PGPASSWORD: drill
        run: |
          # The drill_ prefix is not cosmetic: scripts/restore-drill.sh refuses
          # to restore into a database whose name does not start with it.
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -c "CREATE DATABASE drill_scratch"
          psql -h localhost -U postgres -d drill_scratch -tAc "SELECT version()"

      - name: Run the restore drill
        env:
          R2_ACCOUNT_ID:        ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID:     ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET:            ${{ secrets.R2_BUCKET }}
          DRILL_TARGET_URL: 'postgresql://postgres:drill@localhost:5432/drill_scratch'
          # Matches the standard GitHub runner's 2 vCPUs. Local benchmarking was
          # too noisy on shared CPU to show a reliable optimum (identical work
          # varied between 2s and 23s), so this is chosen on the principle of
          # matching parallelism to cores rather than on a measured win.
          DRILL_JOBS: 2
        run: |
          SELECTOR="--all"
          if [[ "${{ inputs.database }}" != "all" && -n "${{ inputs.database }}" ]]; then
            SELECTOR="--db ${{ inputs.database }}"
          fi
          ./scripts/restore-drill.sh $SELECTOR \
            --tier "${{ inputs.tier || 'daily' }}" \
            --record-dir drill-records \
            --upload-record \
            --recreate

      # Keep the record even when the drill fails — a failed drill is exactly
      # the one you want the evidence for.
      - name: Upload drill records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: restore-drill-records
          path: drill-records/
          if-no-files-found: warn
          retention-days: 400   # longer than the quarterly cadence

      - name: Summarise
        if: always()
        run: |
          {
            echo "## Restore drill"
            echo
            if [[ -d drill-records ]] && ls drill-records/*.json >/dev/null 2>&1; then
              echo "| Database | Outcome | Restore | Rows | Flyway | Newest row |"
              echo "|---|---|---|---|---|---|"
              python3 scripts/drill-record-summary.py drill-records/*.json
              echo
              echo "Records are also in R2 under \`restore-drill/\` and in this run's artifacts."
              echo
              echo "If this drill passed, transcribe the restore times into"
              echo "\`docs/DISASTER-RECOVERY.md\` §2 and date the entry."
            else
              echo "No drill records were produced — the drill failed before it could measure anything."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Raise an issue if the drill failed
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const title = 'Quarterly restore drill failed';
            const body = [
              `The scheduled restore drill failed. **The backups cannot currently be`,
              `assumed restorable.** This is more serious than a failed backup run:`,
              `a failed backup leaves yesterday's good copy in place, whereas a failed`,
              `drill means the copies already in the bucket may be unusable.`,
              ``,
              `Run: ${runUrl}`,
              `Time: ${new Date().toISOString()}`,
              ``,
              `Likely causes, in order:`,
              `1. No backup exists yet for the requested tier — check that`,
              `   \`Nightly Database Backups\` is green and has run at least once.`,
              `2. The R2 token lost read permission or expired.`,
              `3. A Postgres major-version change made existing archives unreadable`,
              `   by the pinned client. This is the failure this drill exists to catch.`,
              `4. A checksum mismatch, which would mean an archive in the bucket is`,
              `   corrupt — treat that as data loss until proven otherwise.`,
              ``,
              `Do not record an RTO from a failed drill.`,
              `See docs/DISASTER-RECOVERY.md for the manual restore procedure.`,
            ].join('\n');

            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'restore-drill-failure',
            });

            if (existing.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing[0].number,
                body: `Failed again: ${runUrl}`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['restore-drill-failure', 'ops'],
              });
            }
