version: "3.8"

# ─────────────────────────────────────────────────────────────────────────────
# EQLink WireMock — local machine simulator
#
# Simulates the EQLink Open API v2 for development without real hardware.
# All 10 machines (washer_01–06, dryer_01–04) are simulated with stateful
# scenarios: machines transition IDLE → RUNNING when started and can be
# individually reset to IDLE via the admin script.
#
# Start:
#   docker compose -f eqlink-mock/docker-compose.yml up -d
#
# Stop:
#   docker compose -f eqlink-mock/docker-compose.yml down
# ─────────────────────────────────────────────────────────────────────────────

services:
  eqlink-mock:
    image: wiremock/wiremock:3.10.0
    container_name: eqlink-wiremock
    ports:
      - "9099:8080"
    volumes:
      - ./mappings:/home/wiremock/mappings
    command:
      - "--verbose"
      - "--global-response-templating"   # enables {{now}} etc. in responses
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/__admin/health"]
      interval: 5s
      timeout: 3s
      retries: 10
