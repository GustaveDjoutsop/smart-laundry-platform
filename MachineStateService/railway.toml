# Railway deployment config — smart-laundry-dev (dev environment)
#
# startCommand overrides the Dockerfile ENTRYPOINT. Setting the Spring profile
# here (instead of only in the Railway dashboard) ensures it is version-controlled
# and always active even after a fresh service redeploy.
#
# For a production Railway service pointing at this repo, override startCommand
# in the Railway UI:  java -Dspring.profiles.active=prod -jar app.jar

[build]
builder = "DOCKERFILE"

[deploy]
startCommand = "java -Dspring.profiles.active=dev -jar app.jar"
healthcheckPath = "/actuator/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
