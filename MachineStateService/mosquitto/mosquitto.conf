# Mosquitto MQTT Broker configuration

# Listen on standard MQTT port (no TLS)
listener 1883
protocol mqtt

# Listen on WebSocket port (useful for browser clients)
listener 9001
protocol websockets

# Allow anonymous connections (set to false and configure passwords for production)
allow_anonymous true

# Persistence
persistence true
persistence_location /mosquitto/data/

# Logging
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
