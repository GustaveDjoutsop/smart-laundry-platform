version: "3.8"

# ─────────────────────────────────────────────────────────────────────────────
# Modbus RTU gateway — local simulator (WireMock)
#
# Simulates the serial<->HTTP Modbus gateway bridge that MachineStateService POSTs
# RTU frames to. It accepts any frame on POST /modbus/rtu and returns:
#   - function 0x10 (write): a CRC-valid write acknowledgement  -> success
#   - function 0x03 (read) : a CRC-valid 20-register IDLE monitor block
#
# This lets the 6 Modbus-only machines (washer_07-09, dryer_05-07) run on
# localhost without real RS485 hardware.
#
# Start:  docker compose -f modbus-mock/docker-compose.yml up -d
# Stop:   docker compose -f modbus-mock/docker-compose.yml down
# Health: curl http://localhost:9090/__admin/health
# ─────────────────────────────────────────────────────────────────────────────

services:
  modbus-mock:
    image: wiremock/wiremock:3.10.0
    container_name: modbus-wiremock
    ports:
      - "9090:8080"
    volumes:
      - ./mappings:/home/wiremock/mappings
    command:
      - "--verbose"
      - "--global-response-templating"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/__admin/health"]
      interval: 5s
      timeout: 3s
      retries: 10
