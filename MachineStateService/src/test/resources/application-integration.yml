spring:
  datasource:
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    schemas: machine
    default-schema: machine
    validate-on-migrate: true
  jpa:
    # Flyway is the schema source of truth here; skip Hibernate's own
    # ddl-auto=validate pass so this test isn't coupled to unrelated tables.
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        default_schema: machine
        dialect: org.hibernate.dialect.PostgreSQLDialect
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://example.auth0.com/

auth0:
  audience: https://smartlaundry.api

machine:
  available-ids:
    - test_washer_01
  heartbeat-timeout-seconds: 120
  cycle-check-interval-ms: 60000

features:
  reservation-enabled: true

mqtt:
  broker-url: tcp://localhost:1883
  enabled: false
