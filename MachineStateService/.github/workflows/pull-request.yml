name: Pull Request Quality Gate

on:
  pull_request:
    branches: [main, master]
    types: [opened, synchronize, reopened]

jobs:
  build-and-test:
    name: Build & Test (Maven Verify)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Run Maven verify (unit tests + JaCoCo)
        run: mvn clean verify -B

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: '**/target/surefire-reports/*.xml'
          retention-days: 7

      - name: Upload JaCoCo coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: '**/target/site/jacoco/'
          retention-days: 7

  sonar:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Cache SonarCloud packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Build, test and analyze with SonarCloud
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn clean verify sonar:sonar -B \
            -Dsonar.projectKey=GustaveDjoutsop_MachineStateService \
            -Dsonar.organization=gustavedjoutsop \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml \
            -Dsonar.pullrequest.key=${{ github.event.pull_request.number }} \
            -Dsonar.pullrequest.branch=${{ github.head_ref }} \
            -Dsonar.pullrequest.base=${{ github.base_ref }}

  integration-test:
    name: Integration Tests (Robot Framework + Mosquitto MQTT)
    runs-on: ubuntu-latest
    needs: sonar

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: machinedb
          POSTGRES_USER: machine_user
          POSTGRES_PASSWORD: machine_pass
        ports:
          - 5435:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Robot Framework and libraries
        run: pip install -r integration-tests/requirements.txt

      - name: Start Mosquitto MQTT broker
        run: |
          docker run -d \
            --name mosquitto \
            -p 1883:1883 \
            eclipse-mosquitto:2.0 \
            mosquitto -c /mosquitto-no-auth.conf
          echo "Waiting for Mosquitto..."
          for i in $(seq 1 10); do
            nc -z localhost 1883 && break
            sleep 2
          done
          echo "Mosquitto ready"

      - name: Build application JAR
        run: mvn clean package -DskipTests -B

      - name: Start MachineStateService
        env:
          AUTH0_ISSUER_URI: https://dev-iuo6si32jobgnmod.eu.auth0.com/
          AUTH0_AUDIENCE: https://smartlaundry.api
        run: |
          java -jar target/machine-state-service-*.jar \
            --server.port=8082 \
            --mqtt.broker-url=tcp://localhost:1883 \
            --spring.security.oauth2.resourceserver.jwt.issuer-uri=${AUTH0_ISSUER_URI} \
            --auth0.audience=${AUTH0_AUDIENCE} \
            &
          echo "Waiting for MachineStateService to be ready (machines seeded)..."
          for i in $(seq 1 30); do
            resp=$(curl -sf http://localhost:8082/v3/api-docs 2>/dev/null || true)
            if [ -n "$resp" ]; then
              echo "Service ready"
              break
            fi
            sleep 3
          done

      - name: Run Robot Framework integration tests
        env:
          # Configured as repo secrets (AUTH0_DEV_CLIENT_ID / AUTH0_DEV_CLIENT_SECRET), synced
          # from the secret manager. No inline fallback — see SECRETS.md.
          AUTH0_CLIENT_ID: ${{ secrets.AUTH0_DEV_CLIENT_ID }}
          AUTH0_CLIENT_SECRET: ${{ secrets.AUTH0_DEV_CLIENT_SECRET }}
        run: |
          robot \
            --outputdir integration-tests/results \
            --log log.html \
            --report report.html \
            --xunit xunit.xml \
            --variable AUTH0_CLIENT_ID:"${AUTH0_CLIENT_ID}" \
            --variable AUTH0_CLIENT_SECRET:"${AUTH0_CLIENT_SECRET}" \
            --variable AUTH0_TOKEN_URL:"https://dev-iuo6si32jobgnmod.eu.auth0.com/oauth/token" \
            --variable AUTH0_AUDIENCE:"https://smartlaundry.api" \
            integration-tests/tests/suites/
        continue-on-error: false

      - name: Upload Robot Framework results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: robot-results-machine
          path: integration-tests/results/
          retention-days: 14

      - name: Publish integration test report
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Integration Tests — MachineStateService
          path: integration-tests/results/xunit.xml
          reporter: java-junit
          fail-on-error: false

      - name: Stop services
        if: always()
        run: |
          pkill -f "machine-state-service" || true
          docker stop mosquitto || true
          docker rm mosquitto || true
