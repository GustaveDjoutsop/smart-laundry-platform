global:
  scrape_interval:     15s
  evaluation_interval: 15s
  external_labels:
    environment: dev
    project: smart-laundry

# ── Grafana Cloud remote_write ────────────────────────────────────────────────
# Credentials are injected via Doppler (project: grafana, config: dev/prd).
# Docker Compose passes them as GRAFANA_CLOUD_* env vars; Prometheus expands
# them at startup because of the --config.expand-env flag in docker-compose.yml.
# To disable Cloud forwarding (local-only mode) simply unset the env vars —
# Prometheus will log a warning for the empty URL and skip the remote_write.
remote_write:
  - url: ${GRAFANA_CLOUD_PROMETHEUS_URL}
    basic_auth:
      username: ${GRAFANA_CLOUD_USERNAME}
      password: ${GRAFANA_CLOUD_API_KEY}
    queue_config:
      max_samples_per_send: 1000
      max_shards: 200
      capacity: 2500
    metadata_config:
      send: true

rule_files:
  - alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: []   # wire up Alertmanager when deploying to prod

# ── Scrape configs ────────────────────────────────────────────────────────────
# Services run on the Docker host; accessed via host.docker.internal from inside
# the monitoring container.  Management ports:
#   api-gateway      :8080  (no separate management port)
#   payment-mgmt     :8081
#   machine-state    :8082
#   reporting-bff    :8083
#   bot-manager      :8091  (management.server.port — separate from app :8090)
scrape_configs:

  - job_name: api-gateway
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['host.docker.internal:8080']
        labels:
          service: api-gateway

  - job_name: payment-management-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['host.docker.internal:8081']
        labels:
          service: payment-management-service

  - job_name: machine-state-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['host.docker.internal:8082']
        labels:
          service: machine-state-service

  - job_name: reporting-bff
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['host.docker.internal:8083']
        labels:
          service: reporting-bff

  - job_name: bot-manager
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['host.docker.internal:8091']
        labels:
          service: bot-manager
