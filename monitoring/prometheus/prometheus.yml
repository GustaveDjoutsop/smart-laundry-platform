global:
  scrape_interval:     15s
  evaluation_interval: 15s
  external_labels:
    environment: dev

rule_files:
  - alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: []   # wire up Alertmanager when deploying to prod

# ── Scrape configs ────────────────────────────────────────────────────────────
# Services run on the Docker host; accessed via host.docker.internal from inside
# the monitoring container.  Management ports:
#   api-gateway      :8080  (no separate management port)
#   payment-mgmt     :8081
#   machine-state    :8082
#   reporting-bff    :8083
#   bot-manager      :8091  (management.server.port — separate from app :8090)
scrape_configs:

  - job_name: api-gateway
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['host.docker.internal:8080']
        labels:
          service: api-gateway

  - job_name: payment-management-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['host.docker.internal:8081']
        labels:
          service: payment-management-service

  - job_name: machine-state-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['host.docker.internal:8082']
        labels:
          service: machine-state-service

  - job_name: reporting-bff
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['host.docker.internal:8083']
        labels:
          service: reporting-bff

  - job_name: bot-manager
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['host.docker.internal:8091']
        labels:
          service: bot-manager
