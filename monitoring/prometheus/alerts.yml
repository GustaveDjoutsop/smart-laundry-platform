groups:
  - name: smart-laundry.slos
    interval: 30s
    rules:

      # ── Service availability ────────────────────────────────────────────────

      - alert: ServiceDown
        expr: up == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Service {{ $labels.service }} is DOWN"
          description: "Prometheus cannot scrape {{ $labels.service }} ({{ $labels.instance }}). Has been down for > 2 minutes."

      # R12: distinct from ServiceDown above (which also matches this target) —
      # every other service's loss is a partial degradation; the gateway fronts
      # all of them (bot/payment/machine/reporting routes), so its loss is a
      # total platform outage. Shorter `for` than ServiceDown for faster
      # detection of the higher-severity case. Deliberately doesn't narrow
      # ServiceDown's own expr to exclude the gateway — the two alerts
      # overlapping on a real gateway outage is fine; that's belt-and-braces,
      # not noise.
      - alert: GatewayDown
        expr: up{job="api-gateway"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "API Gateway is DOWN — total platform outage"
          description: "Prometheus cannot scrape api-gateway ({{ $labels.instance }}) for > 1 minute. Every backend service is fronted by this gateway, so its loss means the whole platform is unreachable, not one service degrading."

      # ── Gateway / API latency ───────────────────────────────────────────────

      - alert: GatewayLatencyHigh
        expr: |
          histogram_quantile(0.95,
            sum by (le) (rate(http_server_requests_seconds_bucket{job="api-gateway"}[5m]))
          ) > 2.0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "API Gateway p95 latency > 2s"
          description: "Gateway p95 response time is {{ $value | humanizeDuration }}. SLO is < 500ms."

      - alert: BFFLatencyHigh
        expr: |
          histogram_quantile(0.95,
            sum by (le) (rate(http_server_requests_seconds_bucket{job="reporting-bff"}[5m]))
          ) > 1.0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Reporting BFF p95 latency > 1s"
          description: "BFF p95 response time is {{ $value | humanizeDuration }}. SLO is < 500ms."

      - alert: WebhookLatencyHigh
        expr: |
          histogram_quantile(0.95,
            sum by (le) (
              rate(http_server_requests_seconds_bucket{job="payment-management-service", uri=~".*/webhook/.*"}[5m])
            )
          ) > 0.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "PMS webhook p95 latency > 500ms"
          description: "Webhook processing p95 is {{ $value | humanizeDuration }}. SLO is < 200ms."

      # ── Error rates ─────────────────────────────────────────────────────────

      - alert: HighErrorRate
        expr: |
          (
            sum by (job) (
              rate(http_server_requests_seconds_count{status=~"5.."}[5m])
            )
            /
            sum by (job) (
              rate(http_server_requests_seconds_count[5m])
            )
          ) > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "High 5xx error rate on {{ $labels.job }}"
          description: "{{ $labels.job }} is returning {{ $value | humanizePercentage }} 5xx errors. SLO is < 1%."

      # ── Outbox relay ────────────────────────────────────────────────────────

      - alert: OutboxDeadLetter
        expr: increase(outbox_relay_dead_letter_total[10m]) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Outbox dead-letter detected"
          description: "{{ $value }} outbox events have been dead-lettered in the last 10 minutes. A pay→start flow failed after max retries."

      - alert: OutboxPendingHigh
        expr: outbox_relay_pending > 50
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Outbox relay backlog is high ({{ $value }} events)"
          description: "More than 50 unprocessed outbox events have been pending for > 5 minutes. Check MachineStateService connectivity."

      - alert: OutboxRelayStalled
        expr: |
          increase(outbox_relay_processed_total[10m]) == 0
          and
          outbox_relay_pending > 0
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Outbox relay stalled — events pending but none processed"
          description: "{{ $value }} events are queued but the relay has not processed any in 10 minutes. Check OutboxRelayService logs."

      - alert: PaidTransactionsWithoutMachineStart
        expr: payment_reconciliation_orphaned_transactions > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Paid transactions with no confirmed machine start"
          description: "{{ $value }} transaction(s) succeeded payment but have no outbox-confirmed machine start after the 15-minute grace period. A customer paid and their machine may never have started — check PaymentManagementService's PayToStartReconciliationService logs, then OutboxRelayService/MachineStateService connectivity."

      # ── JVM health ──────────────────────────────────────────────────────────

      - alert: JVMHeapUsageHigh
        expr: |
          (
            jvm_memory_used_bytes{area="heap"}
            /
            jvm_memory_max_bytes{area="heap"}
          ) > 0.90
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "JVM heap usage > 90% on {{ $labels.job }}"
          description: "{{ $labels.job }} is using {{ $value | humanizePercentage }} of its max heap. Consider increasing -Xmx or investigating memory leaks."

      # ── Connection pool ─────────────────────────────────────────────────────

      - alert: HikariPoolExhausted
        expr: |
          hikaricp_connections_pending > 5
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "HikariCP pool backlog > 5 on {{ $labels.job }}"
          description: "{{ $value }} threads are waiting for a DB connection on {{ $labels.job }}. Consider increasing maximum-pool-size."
