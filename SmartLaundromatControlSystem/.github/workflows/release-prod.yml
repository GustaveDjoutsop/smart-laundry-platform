# .github/workflows/release-prod.yml

name: Release to PROD

on:
  release:
    types: [published] # Triggers when a GitHub Release is published

jobs:
  deploy:
    name: Release to PROD Environment
    runs-on: ubuntu-latest
    environment:
      name: PROD
      url: https://your-app.com

    steps:
      - name: Checkout code
        # This automatically checks out the code at the specific tag of the release
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --production # Install only production dependencies

      - name: Deploy to PROD
        # This is a placeholder for your production deployment command.
        # This step should be highly secure and reliable.
        run: |
          echo "🚀 Releasing version ${{ github.event.release.tag_name }} to PROD..."
          echo "Release complete."
        env:
          MONGO_URI: ${{ secrets.PROD_MONGO_URI }}
          MQTT_BROKER_URL: ${{ secrets.PROD_MQTT_BROKER_URL }}
          CAMPAY_KEY: ${{ secrets.PROD_CAMPAY_KEY }}
          CAMPAY_SECRET: ${{ secrets.PROD_CAMPAY_SECRET }}
          WHATSAPP_TOKEN: ${{ secrets.PROD_META_TOKEN }}
          WHATSAPP_PHONE_ID: ${{ secrets.PROD_META_PHONE_ID }}
          WHATSAPP_VERIFY_TOKEN: ${{ secrets.PROD_META_VERIFY_TOKEN }}