name: Production Release

# Trigger on pushing a tag (e.g., v1.0, v2.1.3)
on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
    # 1. Checkout Code
    - name: Checkout code
      uses: actions/checkout@v3

    # 2. Setup Node.js
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        cache: 'npm'

    # 3. Install Dependencies
    - name: Install Dependencies
      run: npm ci

    # 4. Run Tests
    - name: Run Tests
      run: npm test
      env:
        # Mock env vars so tests don't fail due to missing keys
        CAMPAY_APP_KEY: 'test'
        CAMPAY_APP_SECRET: 'test'
        WHATSAPP_TOKEN: 'test'
        MQTT_BROKER_URL: 'mqtt://test'

    # 5. Prepare Artifact (Zip the code, excluding node_modules)
    - name: Zip Release
      run: |
        zip -r laundry-backend-release.zip . -x "node_modules/*" ".git/*" ".github/*" ".env"

    # 6. Create GitHub Release
    - name: Create Release
      uses: softprops/action-gh-release@v1
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: laundry-backend-release.zip
        token: ${{ secrets.GITHUB_TOKEN }}