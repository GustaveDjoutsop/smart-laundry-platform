services:
  # MongoDB Database
  mongodb:
    image: mongo:7.0
    container_name: laundry-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    environment:
      MONGO_INITDB_DATABASE: laundry_db
    networks:
      - laundry-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/laundry_db --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  # MQTT Broker (Mosquitto)
  mqtt:
    image: eclipse-mosquitto:2.0
    container_name: laundry-mqtt
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
    networks:
      - laundry-network
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -t '$$SYS/#' -C 1 | grep -v Error || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache (for session storage)
  redis:
    image: redis:7-alpine
    container_name: laundry-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - laundry-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: redis-server --appendonly yes

  # Backend API
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NODE_ENV: development
    container_name: laundry-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${PORT:-3000}
      MONGO_URI: mongodb://mongodb:27017/laundry_db
      MQTT_BROKER_URL: mqtt://mqtt:1883
      REDIS_URL: redis://redis:6379
      CAMPAY_APP_KEY: ${CAMPAY_APP_KEY}
      CAMPAY_APP_SECRET: ${CAMPAY_APP_SECRET}
      WHATSAPP_TOKEN: ${WHATSAPP_TOKEN}
      WHATSAPP_PHONE_ID: ${WHATSAPP_PHONE_ID}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN}
      PRICE_SHORT_CYCLE: ${PRICE_SHORT_CYCLE:-1000}
      PRICE_LONG_CYCLE: ${PRICE_LONG_CYCLE:-2000}
      MACHINE_IDS: ${MACHINE_IDS:-washer_01,washer_02}
    depends_on:
      mongodb:
        condition: service_healthy
      mqtt:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - laundry-network
    volumes:
      # Mount source code for development (hot reload with nodemon)
      - ./src:/app/src
      - ./package.json:/app/package.json
      # Prevent node_modules from being overwritten
      - /app/node_modules
    command: npm run dev

  # Backend (Production mode) - Uncomment to use instead of dev mode
  # backend:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile
  #   container_name: laundry-backend
  #   restart: unless-stopped
  #   ports:
  #     - "3000:3000"
  #   env_file:
  #     - .env.production
  #   depends_on:
  #     mongodb:
  #       condition: service_healthy
  #     mqtt:
  #       condition: service_healthy
  #   networks:
  #     - laundry-network

networks:
  laundry-network:
    driver: bridge

volumes:
  mongodb_data:
  mongodb_config:
  redis_data:
