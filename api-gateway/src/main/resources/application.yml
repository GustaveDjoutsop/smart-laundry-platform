server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: api-gateway

  data:
    redis:
      # Used by the Redis-backed RequestRateLimiter. Same fallback convention
      # as spring-bot-manager-only — avoid an empty-string URL.
      url: ${REDIS_URL:${REDISCLOUD_URL:redis://localhost:6379}}

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${AUTH0_ISSUER_URI:https://dev-iuo6si32jobgnmod.eu.auth0.com/}
          audience: ${AUTH0_AUDIENCE:https://smartlaundry.api}

  cloud:
    gateway:
      server:
        webflux:
          # Forward the resolved Authorization header etc. unchanged (default),
          # so backend services keep validating the JWT themselves (defense in
          # depth — see architecture-review/05-API-GATEWAY-DESIGN.md §4).
          globalcors:
            cors-configurations:
              '[/**]':
                allowedOrigins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
                allowedMethods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
                allowedHeaders: '*'
                allowCredentials: true
                maxAge: 3600

          routes:
            - id: bot-manager
              uri: ${BOT_SERVICE_URL:http://localhost:8090}
              predicates:
                - Path=/bot/**
              filters:
                - StripPrefix=1
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 2
                    redis-rate-limiter.burstCapacity: 120

            - id: payment-service
              uri: ${PAYMENT_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/payments/**
              filters:
                - StripPrefix=1
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 2
                    redis-rate-limiter.burstCapacity: 120

            - id: machine-service
              uri: ${MACHINE_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/machines/**
              filters:
                - StripPrefix=1
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 2
                    redis-rate-limiter.burstCapacity: 120

            - id: reporting-bff
              uri: ${REPORTING_BFF_URL:http://localhost:8083}
              predicates:
                - Path=/reports/**
              filters:
                - StripPrefix=1
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 5
                    redis-rate-limiter.burstCapacity: 200

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  # ── Distributed tracing (P1 — OpenTelemetry via Micrometer Tracing) ────────
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/traces

# Logging — JSON structured output + trace/span/correlation IDs are configured
# in logback-spring.xml. Local profile uses a human-readable console pattern.
logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    com.smartlaundry.gateway: ${LOG_LEVEL_GATEWAY:INFO}
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} %-5level [%logger{36}] [traceId=%X{traceId:-}, correlationId=%X{correlationId:-}] - %msg%n"
