# Test configuration - uses H2 in-memory database
spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  flyway:
    enabled: false

admin:
  username: testadmin
  password: testpass

jwt:
  secret: test-secret-key-for-unit-tests-only-do-not-use
  expiration-ms: 3600000

encryption:
  master-key: ""