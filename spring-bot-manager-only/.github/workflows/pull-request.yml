name: Pull Request Quality Gate

on:
  pull_request:
    branches: [develop, main]
    types: [opened, synchronize, reopened]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Required for SonarCloud blame information

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Build and run tests with coverage
        run: mvn clean verify -B -P cicd

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            **/target/surefire-reports/*.xml
          retention-days: 7

      - name: Publish test report
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Maven Tests
          path: '**/target/surefire-reports/TEST-*.xml'
          reporter: java-junit
          fail-on-error: false

  sonar:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Required for SonarCloud blame information

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Cache SonarCloud packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Build, test and analyze with SonarCloud
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn clean verify sonar:sonar -B -P cicd \
            -Dsonar.projectKey=GustaveDjoutsop_spring-bot-manager-only \
            -Dsonar.organization=gustavedjoutsop \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.coverage.jacoco.xmlReportPaths=**/target/site/jacoco/jacoco.xml \
            -Dsonar.pullrequest.key=${{ github.event.pull_request.number }} \
            -Dsonar.pullrequest.branch=${{ github.head_ref }} \
            -Dsonar.pullrequest.base=${{ github.base_ref }}

  code-style:
    name: Code Style (Checkstyle)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Run Checkstyle
        # TODO(tech-debt): sun_checks.xml currently reports 1000+ pre-existing
        # violations repo-wide. Non-blocking until that backlog is addressed.
        run: mvn checkstyle:check -B || true

  dependency-security:
    name: OWASP Dependency Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Cache OWASP NVD database
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: ${{ runner.os }}-owasp-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-owasp-

      - name: Run OWASP Dependency Check
        run: |
          mvn org.owasp:dependency-check-maven:check -B \
            -DfailBuildOnCVSS=9 \
            -DsuppressionFile=owasp-suppressions.xml || true

      - name: Upload OWASP report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owasp-report
          path: '**/target/dependency-check-report.html'
          retention-days: 14

  integration-test:
    name: Integration Tests (Robot Framework + WireMock)
    runs-on: ubuntu-latest
    needs: sonar

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Robot Framework and libraries
        run: pip install -r integration-tests/requirements.txt

      - name: Start WireMock — Meta WhatsApp API (port 9090)
        run: |
          docker run -d --name wiremock-meta \
            -p 9090:8080 \
            -v ${{ github.workspace }}/integration-tests/wiremock/meta:/home/wiremock \
            wiremock/wiremock:3.10.0 --verbose
          for i in $(seq 1 15); do
            curl -sf http://localhost:9090/__admin/health && break; sleep 2
          done
          echo "WireMock Meta ready"

      - name: Start WireMock — PaymentManagementService mock (port 9091)
        run: |
          docker run -d --name wiremock-payment \
            -p 9091:8080 \
            -v ${{ github.workspace }}/integration-tests/wiremock/payment:/home/wiremock \
            wiremock/wiremock:3.10.0 --verbose
          for i in $(seq 1 15); do
            curl -sf http://localhost:9091/__admin/health && break; sleep 2
          done
          echo "WireMock Payment ready"

      - name: Start WireMock — MachineStateService mock (port 9092)
        run: |
          docker run -d --name wiremock-machine \
            -p 9092:8080 \
            -v ${{ github.workspace }}/integration-tests/wiremock/machine:/home/wiremock \
            wiremock/wiremock:3.10.0 --verbose
          for i in $(seq 1 15); do
            curl -sf http://localhost:9092/__admin/health && break; sleep 2
          done
          echo "WireMock Machine ready"

      - name: Build application JAR
        run: mvn clean package -DskipTests -B -pl bot-app -am

      - name: Start spring-bot-manager-only
        env:
          SPRING_DATASOURCE_URL: jdbc:h2:mem:integrationtestdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
          SPRING_DATASOURCE_USERNAME: sa
          SPRING_DATASOURCE_PASSWORD: ""
          JWT_SECRET: integration-test-secret-must-be-at-least-32-chars
          WHATSAPP_VERIFY_SIGNATURE: "false"
          WHATSAPP_API_BASE: http://localhost:9090
          PAYMENT_SERVICE_URL: http://localhost:9091
          MACHINE_STATE_SERVICE_URL: http://localhost:9092
          BOT_CONFIG_DIRECTORY: ${{ github.workspace }}/configs/bots
          VERIFY_TOKEN_LAUNDRY: test-verify-token
          ADMIN_USERNAME: admin
          ADMIN_PASSWORD: test-password
          SPRING_FLYWAY_ENABLED: "false"
          SPRING_JPA_HIBERNATE_DDL_AUTO: create-drop
          # P3: base application.yaml now targets schema "bot" (Supabase
          # consolidation) — H2 needs an explicit CREATE SCHEMA for ddl-auto
          # to create tables there.
          SPRING_JPA_PROPERTIES_HIBERNATE_HBM2DDL_CREATE_NAMESPACES: "true"
          # Auth0 dev tenant — resource server validates Bearer tokens issued here
          AUTH0_ISSUER_URI: https://dev-iuo6si32jobgnmod.eu.auth0.com/
          AUTH0_AUDIENCE: https://smartlaundry.api
          # M2M credentials for the smartlaundry-m2m client-credentials registration
          # (MicroserviceClientConfig) — without these, microserviceWebClientFallback
          # fails closed on every call to PaymentManagementService/MachineStateService.
          AUTH0_CLIENT_ID: ${{ secrets.AUTH0_DEV_CLIENT_ID }}
          AUTH0_CLIENT_SECRET: ${{ secrets.AUTH0_DEV_CLIENT_SECRET }}
        run: |
          java -jar bot-app/target/bot-app-*.jar \
            --server.port=8090 \
            --spring.security.oauth2.resourceserver.jwt.issuer-uri=${AUTH0_ISSUER_URI} \
            --auth0.audience=${AUTH0_AUDIENCE} \
            &
          echo "Waiting for spring-bot-manager-only..."
          for i in $(seq 1 40); do
            curl -sf http://localhost:8090/v3/api-docs > /dev/null 2>&1 && break
            sleep 3
          done
          echo "Bot service ready"

      - name: Run Robot Framework integration tests
        env:
          # Auth0 M2M credentials for token acquisition in robot tests.
          # Configured as repo secrets (AUTH0_DEV_CLIENT_ID / AUTH0_DEV_CLIENT_SECRET), synced
          # from the secret manager. No inline fallback — see SECRETS.md.
          AUTH0_CLIENT_ID: ${{ secrets.AUTH0_DEV_CLIENT_ID }}
          AUTH0_CLIENT_SECRET: ${{ secrets.AUTH0_DEV_CLIENT_SECRET }}
        run: |
          robot \
            --outputdir integration-tests/results \
            --log log.html \
            --report report.html \
            --xunit xunit.xml \
            --variable BOT_ID:laundry \
            --variable VERIFY_TOKEN:test-verify-token \
            --variable AUTH0_CLIENT_ID:"${AUTH0_CLIENT_ID}" \
            --variable AUTH0_CLIENT_SECRET:"${AUTH0_CLIENT_SECRET}" \
            --variable AUTH0_TOKEN_URL:"https://dev-iuo6si32jobgnmod.eu.auth0.com/oauth/token" \
            --variable AUTH0_AUDIENCE:"https://smartlaundry.api" \
            integration-tests/tests/suites/
        continue-on-error: false

      - name: Upload Robot Framework results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: robot-results-bot
          path: integration-tests/results/
          retention-days: 14

      - name: Publish integration test report
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Integration Tests — spring-bot-manager-only
          path: integration-tests/results/xunit.xml
          reporter: java-junit
          fail-on-error: false

      - name: Stop all services
        if: always()
        run: |
          pkill -f "bot-app" || true
          docker stop wiremock-meta wiremock-payment wiremock-machine || true
          docker rm wiremock-meta wiremock-payment wiremock-machine || true
