apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.app }}
  labels:
    app: {{ .Values.app }}
    group: {{ .Values.group }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
    - port: {{ .Values.healthcheck.port }}
      targetPort: management
      protocol: TCP
      name: management
  selector:
    app: {{ .Values.app }}
