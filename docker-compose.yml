version: '3.8'

# ── REMOVED: the `backend` service (container_name: laundry-backend) ─────────
#
# A Node.js/Prisma prototype that predates the Spring services. Removed because
# it was provably unbuildable, not merely unused:
#
#   * `build: .` used the root Dockerfile, which ran `COPY package*.json ./`
#     and `COPY prisma ./prisma/`. Neither a root package.json nor a prisma/
#     directory exists in this repository, so `docker compose up` failed at
#     build. The root Dockerfile is removed in the same commit.
#   * It carried a live Twilio account SID and auth token in plaintext. WhatsApp
#     messaging moved to the Meta WhatsApp Cloud API (see spring-bot-manager-only
#     and BotManagerService); nothing in the platform reads TWILIO_* and `twilio`
#     is not a dependency in any package.json.
#
# It also occupied host port 3000, which collides with the dashboard's
# documented dev port (see the port unification work in ARCHITECTURE_TODO.md).
#
# Recoverable from history if ever needed: `git show f45df47:docker-compose.yml`

services:
  # NOTE: with `backend` gone, postgres and mqtt have no dependents in this file.
  # Both are kept as standalone local-dev conveniences, but be aware:
  #   * The three Spring services each have their own compose file with their own
  #     Postgres (ports 5434/5435/15432); this `laundry_dev` database on 5432 is
  #     not used by any of them.
  #   * The mqtt service mounts ./mosquitto/config, ./mosquitto/data and
  #     ./mosquitto/log, none of which exist in the repository. Docker creates
  #     the missing directories automatically, so the broker does start — but
  #     with Mosquitto's built-in defaults rather than any intended config.
  #     Removing the legacy MQTT stack is already tracked in
  #     ARCHITECTURE_TODO.md Phase 0 and is left to that change rather than
  #     widened into this one.
  # `redis` IS still required — the api-gateway service depends on it.
  postgres:
    image: postgres:15-alpine
    container_name: laundry-postgres
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: laundry
      POSTGRES_PASSWORD: laundry123
      POSTGRES_DB: laundry_dev
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U laundry']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: laundry-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  mqtt:
    image: eclipse-mosquitto:2
    container_name: laundry-mqtt
    restart: unless-stopped
    ports:
      - '1883:1883'
      - '9001:9001'
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
    healthcheck:
      test: ['CMD-SHELL', 'mosquitto_sub -t "$$SYS/#" -C 1 | grep -v Error || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5

  # API Gateway (P1, architecture-review/05-API-GATEWAY-DESIGN.md). Opt-in via
  # `docker compose --profile gateway up` — kept behind a profile so the default
  # `docker compose up` stays a lightweight infrastructure-only stack.
  # (This previously read "not part of the legacy laundry-backend stack above";
  # that service has been removed, so the reference is gone.) The 3 Spring services
  # (bot-manager :8090, PaymentManagementService :8081, MachineStateService
  # :8082) are expected to run on the host (mvn spring-boot:run), reachable
  # from inside the container via host.docker.internal.
  gateway:
    build: ./api-gateway
    container_name: laundry-api-gateway
    profiles: ['gateway']
    restart: unless-stopped
    ports:
      - '8080:8080'
    environment:
      REDIS_URL: redis://redis:6379
      BOT_SERVICE_URL: ${BOT_SERVICE_URL:-http://host.docker.internal:8090}
      PAYMENT_SERVICE_URL: ${PAYMENT_SERVICE_URL:-http://host.docker.internal:8081}
      MACHINE_SERVICE_URL: ${MACHINE_SERVICE_URL:-http://host.docker.internal:8082}
      REPORTING_BFF_URL: ${REPORTING_BFF_URL:-http://host.docker.internal:8083}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      AUTH0_ISSUER_URI: ${AUTH0_ISSUER_URI:-https://dev-iuo6si32jobgnmod.eu.auth0.com/}
      AUTH0_AUDIENCE: ${AUTH0_AUDIENCE:-https://smartlaundry.api}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4318}
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    depends_on:
      redis:
        condition: service_healthy

  # Reporting BFF (P5). Aggregates Supabase payment+machine data for the
  # dashboard. Opt-in via `docker compose --profile gateway up`.
  reporting-bff:
    build: ./reporting-bff
    container_name: laundry-reporting-bff
    profiles: ['gateway']
    restart: unless-stopped
    ports:
      - '8083:8083'
    environment:
      SPRING_DATASOURCE_URL: ${REPORTING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${REPORTING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${REPORTING_DATASOURCE_PASSWORD}
      AUTH0_ISSUER_URI: ${AUTH0_ISSUER_URI:-https://dev-iuo6si32jobgnmod.eu.auth0.com/}
      AUTH0_AUDIENCE: ${AUTH0_AUDIENCE:-https://smartlaundry.api}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4318}

  # OTLP collector + tracing UI (P1, W11 distributed tracing). All 4 services
  # (gateway + bot-manager + PaymentManagementService + MachineStateService)
  # export OTLP/HTTP traces to OTEL_EXPORTER_OTLP_ENDPOINT, default
  # http://localhost:4318. Opt-in via `docker compose --profile tracing up`.
  # Services running on the host can keep the default localhost:4318; the
  # `gateway` service above is overridden to reach this container by name.
  jaeger:
    image: jaegertracing/all-in-one:1.62
    container_name: laundry-jaeger
    profiles: ['tracing']
    restart: unless-stopped
    ports:
      - '16686:16686' # Jaeger UI
      - '4317:4317'   # OTLP gRPC receiver
      - '4318:4318'   # OTLP HTTP receiver
    environment:
      COLLECTOR_OTLP_ENABLED: 'true'

  # ── Monitoring (P7 — SLOs + dashboards). Opt-in via:
  #   docker compose --profile monitoring up prometheus grafana
  # Prometheus scrapes all 5 services via host.docker.internal; Grafana is
  # pre-provisioned with the Prometheus datasource + smart-laundry dashboard.
  # Alert rules in monitoring/prometheus/alerts.yml are evaluated by Prometheus.
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: laundry-prometheus
    profiles: ['monitoring']
    restart: unless-stopped
    ports:
      - '9090:9090'
    volumes:
      - ./monitoring/prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
      - '--enable-feature=expand-external-labels'
      - '--config.expand-env=true'
    environment:
      # Grafana Cloud remote_write credentials (Doppler project: grafana).
      # Run via: doppler run --project grafana --config dev -- docker compose --profile monitoring up
      GRAFANA_CLOUD_PROMETHEUS_URL: ${GRAFANA_CLOUD_PROMETHEUS_URL:-}
      GRAFANA_CLOUD_USERNAME: ${GRAFANA_CLOUD_USERNAME:-}
      GRAFANA_CLOUD_API_KEY: ${GRAFANA_CLOUD_API_KEY:-}
    extra_hosts:
      - 'host.docker.internal:host-gateway'

  grafana:
    image: grafana/grafana:11.1.0
    container_name: laundry-grafana
    profiles: ['monitoring']
    restart: unless-stopped
    ports:
      - '3002:3000'
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: 'false'
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:
