# CI/CD Environment Configuration
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/smartbot}
spring.data.redis.url=${REDIS_URL:redis://localhost:6379}
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
whatsapp.verify-signature=true

# Reduced timeouts for CI
payment.poll-interval-ms=5000
payment.timeout-ms=300000

# Logging for CI
logging.level.com.botmanager=DEBUG
