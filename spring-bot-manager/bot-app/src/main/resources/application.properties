# Server Configuration
server.port=${PORT:8090}
spring.application.name=spring-bot-manager

# Management/Actuator
management.server.port=${MANAGEMENT_PORT:8081}
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized

# Redis Configuration (optional - falls back to in-memory if not available)
# IMPORTANT: avoid empty-string URLs (Spring will fail fast with "Invalid Redis URL ''")
spring.data.redis.url=${REDIS_URL:${REDISCLOUD_URL:redis://localhost:6379}}
spring.data.redis.timeout=5000ms

# PostgreSQL Configuration
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/smartbot}
spring.datasource.username=${DATABASE_USERNAME:smartbot}
spring.datasource.password=${DATABASE_PASSWORD:smartbot}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# WhatsApp Configuration
whatsapp.api.version=${WHATSAPP_API_VERSION:v20.0}
whatsapp.api.base-url=${WHATSAPP_API_BASE:https://graph.facebook.com}
whatsapp.verify-signature=${WHATSAPP_VERIFY_SIGNATURE:true}
whatsapp.app-secret=${WHATSAPP_APP_SECRET:}

# Payment Configuration
payment.ttl-seconds=${PAYMENT_TTL_SECONDS:86400}
payment.poll-interval-ms=${PAYMENT_POLL_INTERVAL_MS:10000}
payment.timeout-ms=${PAYMENT_TIMEOUT_MS:600000}

# CamPay Configuration
campay.token=${CAMPAY_TOKEN:}
campay.base-url=${CAMPAY_BASE_URL:https://www.campay.net/api}
campay.auth-scheme=${CAMPAY_AUTH_SCHEME:Token}
campay.collect-path=${CAMPAY_COLLECT_PATH:/collect/}
campay.status-path=${CAMPAY_STATUS_PATH:/transaction/}
campay.webhook-secret=${CAMPAY_WEBHOOK_SECRET:}
campay.webhook-signature-header=${CAMPAY_WEBHOOK_SIGNATURE_HEADER:x-campay-signature}

# MQTT Configuration
mqtt.url=${MQTT_URL:}
mqtt.username=${MQTT_USERNAME:}
mqtt.password=${MQTT_PASSWORD:}
mqtt.topic-prefix=${MQTT_TOPIC_PREFIX:}

# Rate Limiting
rate-limit.whatsapp.window-ms=${RATE_LIMIT_WHATSAPP_WINDOW_MS:60000}
rate-limit.whatsapp.max-requests=${RATE_LIMIT_WHATSAPP_MAX:120}
rate-limit.payments.window-ms=${RATE_LIMIT_PAYMENTS_WEBHOOK_WINDOW_MS:60000}
rate-limit.payments.max-requests=${RATE_LIMIT_PAYMENTS_WEBHOOK_MAX:120}

# Bot Configuration
bot.config-directory=${BOT_CONFIG_DIRECTORY:configs/bots}

# CORS Configuration
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Admin API
admin.username=${ADMIN_USERNAME:admin}
admin.password=${ADMIN_PASSWORD:change-me-in-production}

# JWT Authentication
jwt.secret=${JWT_SECRET:change-me-in-production-must-be-at-least-32-chars}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# Encryption
encryption.master-key=${ENCRYPTION_MASTER_KEY:}

# Logging
logging.level.com.botmanager=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
