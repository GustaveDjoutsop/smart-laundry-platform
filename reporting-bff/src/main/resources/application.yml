server:
  port: ${PORT:8083}

spring:
  application:
    name: reporting-bff

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5436/postgres?currentSchema=ops&prepareThreshold=0}
    username: ${SPRING_DATASOURCE_USERNAME:reporting_svc}
    password: ${SPRING_DATASOURCE_PASSWORD:devpassword}
    hikari:
      minimum-idle: 2
      maximum-pool-size: 10
      pool-name: ReportingBffPool
      connection-timeout: 20000

  # ── Cache layer (R9) — same Redis instance as gateway rate limiting / bot
  # conversation state, same fallback convention: avoid an empty-string URL. Per-cache
  # TTLs are set explicitly in CacheConfig, not here.
  data:
    redis:
      url: ${REDIS_URL:${REDISCLOUD_URL:redis://localhost:6379}}
      timeout: 5000ms
  cache:
    type: redis

  flyway:
    enabled: true
    schemas: ops
    default-schema: ops
    locations: classpath:db/migration
    baseline-on-migrate: true
    # Session-mode pooler (5432) for migrations — advisory locks don't survive
    # transaction-mode pooler (6543) boundary resets.
    url: ${FLYWAY_DATASOURCE_URL:jdbc:postgresql://localhost:5436/postgres?currentSchema=ops&prepareThreshold=0}
    user: ${FLYWAY_DATASOURCE_USERNAME:reporting_svc}
    password: ${FLYWAY_DATASOURCE_PASSWORD:devpassword}

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${AUTH0_ISSUER_URI:https://dev-iuo6si32jobgnmod.eu.auth0.com/}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  health:
    redis:
      # R9: a Redis outage must degrade caching (see ResilientCache /
      # LoggingCacheErrorHandler), not flip this service's overall health to DOWN and
      # take it out of rotation — that would be the exact outage R9 exists to avoid.
      enabled: false
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/traces
      headers:
        Authorization: ${GRAFANA_OTLP_BASIC_AUTH:}

auth0:
  audience: ${AUTH0_AUDIENCE:https://smartlaundry.api}
  management:
    domain: ${AUTH0_DOMAIN:dev-iuo6si32jobgnmod.eu.auth0.com}
    client-id: ${AUTH0_MGMT_CLIENT_ID:}
    client-secret: ${AUTH0_MGMT_CLIENT_SECRET:}
    connection: ${AUTH0_MGMT_CONNECTION:Username-Password-Authentication}

cors:
  # R6: dashboard dev server runs on 3001 (smart-laundry-dashboard/package.json
  # `next dev -p 3001`) -- dropped the 3000 fallback, which pointed at the legacy
  # monolith/BotManagerService, neither a browser client of this API.
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3001}

whatsapp:
  business-phone: ${WHATSAPP_BUSINESS_PHONE:}

logging:
  level:
    root: INFO
    com.smartlaundromat.reporting: DEBUG
